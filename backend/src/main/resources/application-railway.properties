spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

spring.jackson.serialization.write-dates-as-timestamps=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

app.rate-limit.login.capacity=5
app.rate-limit.login.refill-minutes=15

server.port=${PORT:8080}

resend.api-key=${RESEND_API_KEY}
# CHANGE TO YOUR OWN DOMAIN
resend.from-email=onboarding@resend.dev
app.notification-email=${OWNER_EMAIL}